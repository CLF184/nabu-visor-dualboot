file_log=0
# ============================================================================
#  nabu_visor_dualboot - Visor boot.conf
#  Installed on the ESP at \EFI\visor\boot.conf (the build copies it there).
#
#  Boot flow (Visor UI 与上游一致；系统启动由固件卷内驱动接管):
#    - 菜单每次开机都显示；timeout 秒后自动启动 default 条目。
#      任何按键取消倒计时；选中后需要确认。
#    - Entry 0 = Android：驱动调用 Renegade 程序，写 128 个 0x5241 标记并热重启，
#      内核入口分流代码读到标记后跳回原 Android 内核。
#    - Entry 1 = Windows：驱动把控制权交回固件原始 BDS 入口，
#      Windows 走与未修改固件时完全一样的原生启动流程。
#    - nabu_action 是本移植扩展键（android | bds），见下方条目。
#    - selfheal 默认关闭：本方案由 FD 内驱动显示 Visor，
#      自愈会写 NVRAM/覆盖回退路径，本设备上不需要。
# ============================================================================

timeout=5
default=0
remember_last=0
autoboot=0
selfheal=0

# --- appearance -------------------------------------------------------------
title=none
background=\EFI\visor\backgrounds\default.png
center_info=1
power_icons=1
power_position=bottomleft
shutdown_icon=\EFI\visor\icons\power_shutdown.png
reboot_icon=\EFI\visor\icons\power_reboot.png
firmware_icon=\EFI\visor\icons\power_bios.png

# --- entries ----------------------------------------------------------------
# nabu_action 是本移植扩展：
#   android = 由固件内驱动写 DRAM 标记 + 热重启，内核入口分流代码回到 Android
#   bds     = 交回固件原始 BDS 入口，Windows 按原生流程启动
#   linux   = 原版 rEFInd 加载本条目的实际 kernel/initrd/cmdline
# android/bds 的 kernel 仅供展示；linux 的 kernel 是交给 rEFInd 的实际目标。
entry {
    name=Android
    icon=\EFI\visor\icons\linux.png
    kernel=\EFI\visor\NabuAndroid.efi
    nabu_action=android
}

entry {
    name=Windows
    icon=\EFI\visor\icons\windows.png
    kernel=\EFI\Microsoft\Boot\bootmgfw.efi
    nabu_action=bds
}

