file_log=0
# ============================================================================
#  nabu_visor_dualboot - Visor boot.conf
#  Installed on the ESP at \EFI\visor\boot.conf (the build copies it there).
#
#  ESP 独立应用方案：原固件 BDS 加载 EFI/BOOT/bootaa64.efi。
#    - 菜单每次开机都显示；timeout 秒后自动启动 default 条目。
#      任何按键取消倒计时；选中后需要确认。
#    - Android：普通 EFI 条目加载 NabuAndroid.efi，写标记后 PSCI 重启。
#    - Windows：普通 EFI 条目直接加载微软 bootmgfw.efi。
#    - Recovery：普通 EFI 条目加载 NabuRecovery.efi，写 BCB＋标记后 PSCI 重启。
#    - FD 不注入驱动；需使用允许未签名 EFI 应用的 NoSB 固件。
#    - selfheal=0 避免自动改变 NVRAM 或 EFI/BOOT 回退路径。
# ============================================================================

timeout=5
default=0
remember_last=0
autoboot=0
selfheal=0

# --- appearance -------------------------------------------------------------
title=none
background=\EFI\visor\backgrounds\default.png
center_info=1
power_icons=1
power_position=bottomleft
shutdown_icon=\EFI\visor\icons\power_shutdown.png
reboot_icon=\EFI\visor\icons\power_reboot.png
firmware_icon=\EFI\visor\icons\power_bios.png

# --- entries ----------------------------------------------------------------
# Android、Windows、Recovery 使用实际 EFI 路径，不配置 nabu_action。
# Linux 可使用 nabu_action=linux，通过原版 rEFInd 加载 kernel/initrd/cmdline。
entry {
    name=Android
    icon=\EFI\visor\icons\linux.png
    kernel=\EFI\visor\NabuAndroid.efi
}

entry {
    name=Windows
    icon=\EFI\visor\icons\windows.png
    kernel=\EFI\Microsoft\Boot\bootmgfw.efi
}

entry {
    name=Recovery
    icon=\EFI\visor\icons\power_bios.png
    kernel=\EFI\visor\NabuRecovery.efi
}

