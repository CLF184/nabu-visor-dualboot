file_log=0
# ============================================================================
#  nabu_visor_dualboot - Visor boot.conf
#  Installed on the ESP at \EFI\visor\boot.conf (the build copies it there).
#
#  ESP 独立应用方案：原固件加载 EFI/BOOT/bootaa64.efi。
#  Android / Windows 使用普通 EFI 条目，Linux 保留 rEFInd；Recovery 使用左下角按钮。
#  首次 5 秒无操作启动 Android；任何操作取消本次倒计时。
#  原样使用 NoSB FD，Windows Secure Boot 保护关闭。
# ============================================================================

timeout=5
default=0
remember_last=0
autoboot=0
selfheal=0

# --- appearance -------------------------------------------------------------
title=none
background=\EFI\visor\backgrounds\bg_custom.png
center_info=0
power_icons=1
power_position=bottomleft
shutdown_icon=\EFI\visor\icons\power_shutdown.png
reboot_icon=\EFI\visor\icons\power_reboot.png
firmware_icon=\EFI\visor\icons\power_bios.png

# --- entries ----------------------------------------------------------------
# Android / Windows 的 kernel 是实际加载的 EFI 文件。
# nabu_action=linux 仍通过原版 rEFInd 加载对应 Linux。
entry {
    name=Android
    icon=\EFI\visor\icons\linux.png
    kernel=\EFI\visor\NabuAndroid.efi
}

entry {
    name=Windows
    icon=\EFI\visor\icons\windows.png
    kernel=\EFI\Microsoft\Boot\bootmgfw.efi
}


entry {
    name=Ubuntu
    icon=\EFI\visor\icons\ubuntu.png
    kernel=\EFI\ubuntu\6.14.11-camera.efi
    nabu_action=linux
}

